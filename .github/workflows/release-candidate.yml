name: Release Candidate
on:
  workflow_call:
  workflow_dispatch:

# One release candidate at a time: a newer commit on main supersedes the build in
# flight, which would otherwise overwrite its assets in an undefined order.
concurrency:
  group: release-candidate
  cancel-in-progress: true

permissions:
  contents: write

env:
  RC_TAG: release-candidate

jobs:
  # The rolling release is (re)created once, before any platform uploads to it.
  Prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@master
      - name: Recreate the Release Candidate release
        run: |
          gh release delete "$RC_TAG" --yes --cleanup-tag || true
          gh release create "$RC_TAG" \
            --target "$GITHUB_SHA" \
            --title "Release Candidate" \
            --prerelease \
            --notes "Automated build of \`main\` (${GITHUB_SHA::7}), $(date -u '+%Y-%m-%d %H:%M UTC')."

  Build:
    needs: Prepare
    uses: ./.github/workflows/build-platforms.yml
    with:
      ref: ${{ github.sha }}
      release-tag: release-candidate
      # macOS is not built for release candidates.
      macos: false
    secrets: inherit

  # The build number identifies the candidate, so it is bumped only once every
  # platform has published its artifacts.
  Bump:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: main
      - name: Compute the next build number
        run: |
          current=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "(.*)".*/\1/')
          next=$(bash scripts/increment_version.sh build "$current")
          echo "$current -> $next"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.NEXT_VERSION }}
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json packages/app/package.json
          # Nothing to do when the build number already matches (e.g. a re-run).
          git diff --cached --quiet && exit 0
          # `[skip ci]` keeps this commit from starting another release candidate.
          git commit -m "chore: bump build to ${NEXT_VERSION} [skip ci]"
          git pull --rebase
          git push
