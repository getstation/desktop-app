name: Release Candidate
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One release candidate at a time: a newer commit on main supersedes the build in
# flight, which would otherwise overwrite its assets in an undefined order.
concurrency:
  group: release-candidate
  cancel-in-progress: true

permissions:
  contents: write

env:
  RC_TAG: release-candidate

jobs:
  # The rolling release is (re)created once, before any platform uploads to it.
  Prepare:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@master
      - name: Recreate the Release Candidate release
        run: |
          gh release delete "$RC_TAG" --yes --cleanup-tag || true
          gh release create "$RC_TAG" \
            --target "$GITHUB_SHA" \
            --title "Release Candidate" \
            --prerelease \
            --notes "Automated build of \`main\` (${GITHUB_SHA::7}), $(date -u '+%Y-%m-%d %H:%M UTC')."

  Linux:
    needs: Prepare
    # Native runners per architecture: the app ships native modules, and
    # cross-compiling them from x64 would package x64 binaries into the arm64 app.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      # Since Electron 42 the `electron` package no longer downloads its binary in a
      # `postinstall` script; it does so lazily on first use. Prefetch it explicitly so a
      # download failure is reported here instead of mid-build.
      - name: Download Electron binary
        run: yarn workspace station-desktop-app exec install-electron
      - name: Build
        run: yarn build
      # electron-builder only ships a prebuilt fpm for linux-x86_64; on an arm64
      # host it falls back to `fpm` from PATH, which the deb and rpm targets need.
      - name: Install fpm
        if: matrix.arch != 'x64'
        run: sudo gem install fpm --no-document
      - name: Package
        run: yarn workspace station-desktop-app exec cross-env NODE_ENV=production electron-builder --${{ matrix.arch }} --publish never
      - name: Attach artifacts to the release
        run: bash scripts/upload-release-assets.sh "$RC_TAG"

  MacOs:
    if: false
    needs: Prepare
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      AC_USERNAME: ${{ secrets.AC_USERNAME }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
      AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download Electron binary
        run: yarn workspace station-desktop-app exec install-electron
      - name: Build
        run: yarn build
      - name: Package
        run: yarn workspace station-desktop-app exec cross-env NODE_ENV=production electron-builder --publish never
      - name: Attach artifacts to the release
        run: bash scripts/upload-release-assets.sh "$RC_TAG"

  Windows:
    needs: Prepare
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download Electron binary
        run: yarn workspace station-desktop-app exec install-electron
      - name: Build
        run: yarn build
      - name: Package
        run: yarn workspace station-desktop-app exec cross-env NODE_ENV=production electron-builder --${{ matrix.arch }} --publish never
      # Both architectures write their own `latest.yml`, and the release holds one.
      # electron-updater has no per-architecture channel on Windows, so the x64
      # feed is the one published and arm64 drops its copy before uploading.
      - name: Drop the arm64 update feed
        if: matrix.arch != 'x64'
        shell: bash
        run: rm -f release/latest.yml
      - name: Attach artifacts to the release
        shell: bash
        run: bash scripts/upload-release-assets.sh "$RC_TAG"

  # The build number identifies the candidate, so it is bumped only once every
  # platform has published its artifacts.
  Bump:
    needs:
      - Linux
      # - MacOs
      - Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: main
      - name: Increment the build number
        run: |
          current=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "(.*)".*/\1/')
          next=$(bash scripts/increment_version.sh build "$current")
          echo "$current -> $next"
          for manifest in package.json packages/app/package.json; do
            sed -i -E "0,/\"version\":/s/\"version\": \".*\"/\"version\": \"$next\"/" "$manifest"
          done
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json packages/app/package.json
          # Nothing to do when the build number already matches (e.g. a re-run).
          git diff --cached --quiet && exit 0
          # `[skip ci]` keeps this commit from starting another release candidate.
          git commit -m "chore: bump build to ${NEXT_VERSION} [skip ci]"
          git pull --rebase
          git push
