name: Publish Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version: `current` only drops the build number, others increment it"
        type: choice
        required: true
        default: current
        options:
          - current
          - major
          - minor
          - patch

# Only one release at a time; never cancel one half-way through.
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Sets the release version, commits it and tags it.
  Version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@master
        with:
          ref: main
      - name: Compute the release version
        id: release
        run: |
          current=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "(.*)".*/\1/')
          if [[ "${{ inputs.version }}" == "current" ]]; then
            # Only drop the build number.
            next=${current%%-*}
          else
            next=$(bash scripts/increment_version.sh "${{ inputs.version }}" "$current")
          fi
          echo "$current -> $next"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "VERSION=$next" >> "$GITHUB_ENV"
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.VERSION }}
      - name: Commit, tag and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json packages/app/package.json
          # Nothing to commit when the version is already final (`current` on a clean version).
          git diff --cached --quiet || git commit -m "chore: release ${VERSION} [skip ci]"
          git tag "v${VERSION}"
          git push origin main "v${VERSION}"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --draft \
            --title "v${VERSION}" \
            --generate-notes

  Build:
    needs: Version
    uses: ./.github/workflows/build-platforms.yml
    with:
      ref: ${{ needs.Version.outputs.tag }}
      release-tag: ${{ needs.Version.outputs.tag }}
    secrets: inherit

  # Starts the next development cycle once every platform has published.
  Bump:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: main
      - name: Compute the next development version
        run: |
          current=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "(.*)".*/\1/')
          next="$(bash scripts/increment_version.sh patch "$current")-b1"
          echo "$current -> $next"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.NEXT_VERSION }}
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json packages/app/package.json
          # `[skip ci]` keeps this commit from starting a release candidate.
          git commit -m "chore: bump version to ${NEXT_VERSION} [skip ci]"
          git pull --rebase
          git push
