name: Publish Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version: `current` only drops the build number, others increment it"
        type: choice
        required: true
        default: current
        options:
          - current
          - major
          - minor
          - patch

# Only one release at a time; never cancel one half-way through.
concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Sets the release version, commits it and tags it.
  Version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@master
        with:
          ref: main
          # The rollback reverts the release commit, which needs its parent.
          fetch-depth: 0
      - name: Compute the release version
        id: release
        run: |
          current=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "(.*)".*/\1/')
          if [[ "${{ inputs.version }}" == "current" ]]; then
            # Only drop the build number.
            next=${current%%-*}
          else
            next=$(bash scripts/increment_version.sh "${{ inputs.version }}" "$current")
          fi
          echo "$current -> $next"
          echo "::notice title=Release::New version is $next"
          echo "### New version is $next" >> "$GITHUB_STEP_SUMMARY"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "VERSION=$next" >> "$GITHUB_ENV"
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.VERSION }}
      - name: Commit and tag
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json packages/app/package.json
          # Nothing to commit when the version is already final (`current` on a clean version).
          if ! git diff --cached --quiet; then
            git commit -m "Release ${VERSION} [skip ci]"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
          git tag "v${VERSION}"
      - name: Push the commit and tag
        id: push
        run: git push origin main "v${VERSION}"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --verify-tag \
            --draft \
            --title "v${VERSION}" \
            --generate-notes
      # Undo the push when the draft release could not be created.
      - name: Roll back
        if: failure() && steps.push.outcome == 'success'
        uses: ./.github/actions/rollback-release
        with:
          version: ${{ env.VERSION }}
          commit: ${{ steps.commit.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

  Build:
    needs: Version
    uses: ./.github/workflows/build-platforms.yml
    with:
      ref: ${{ needs.Version.outputs.tag }}
      release-tag: ${{ needs.Version.outputs.tag }}
    secrets: inherit

  # Undo the version step when the build did not complete.
  Rollback:
    needs:
      - Version
      - Build
    if: always() && needs.Version.result == 'success' && needs.Build.result != 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/rollback-release
        with:
          version: ${{ needs.Version.outputs.version }}
          commit: ${{ needs.Version.outputs.commit }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Starts the next development cycle once every platform has published.
  Bump:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          ref: main
      - name: Compute the next development version
        run: |
          current=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": "(.*)".*/\1/')
          next="$(bash scripts/increment_version.sh patch "$current")-b1"
          echo "$current -> $next"
          echo "::notice title=Next development version::Next version is $next"
          echo "Next development version is $next" >> "$GITHUB_STEP_SUMMARY"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
      - uses: ./.github/actions/set-version
        with:
          version: ${{ env.NEXT_VERSION }}
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json packages/app/package.json
          # `[skip ci]` keeps this commit from starting a release candidate.
          git commit -m "Bump version to ${NEXT_VERSION} [skip ci]"
          git pull --rebase
          git push
