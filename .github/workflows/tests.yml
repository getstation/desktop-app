name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    ## This is used to not re-run the build if only thoses files have changed
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
jobs:
  Linux:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "24"
          cache: "yarn"
      # - name: Configure Node
      #   run: |
      #     yarn set version stable
      - name: Install dependencies
        run: yarn install --immutable
      # Since Electron 42 the `electron` package no longer downloads its binary in a
      # `postinstall` script; it does so lazily on first use. Prefetch it explicitly so a
      # download failure is reported here instead of mid-build.
      - name: Download Electron binary
        run: yarn workspace station-desktop-app exec install-electron
      - name: Build
        run: yarn build

  MacOs:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download Electron binary
        run: yarn workspace station-desktop-app exec install-electron
      - name: Build
        run: yarn build
      - name: Tests
        run: yarn test

  Windows:
    runs-on: windows-2025
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@master
        with:
          node-version: "24"
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Download Electron binary
        run: yarn workspace station-desktop-app exec install-electron
      - name: Build
        run: yarn run build
      - name: Tests
        run: yarn run test

  # Last step on main: publish the release candidate once every platform passes.
  ReleaseCandidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - Linux
      - MacOs
      - Windows
    permissions:
      contents: write
    uses: ./.github/workflows/release-candidate.yml
    secrets: inherit
