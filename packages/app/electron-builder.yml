appId: org.getstation.DesktopApp

publish:
  provider: 'github'

asar: true
# No explicit asarUnpack: an unpack pattern makes app-builder-lib resolve every
# packaged file against the app dir, which throws "must be under" for
# workspace deps symlinked outside packages/app (@getstation/sdk, appstore).
# electron-builder's smartUnpack already unpacks any package holding .node/.dll.

afterPack: '../../scripts/after-pack.js'
# afterSign: '../../scripts/notarize.js'

directories:
  output: '../../release'

protocols:
  name: Station
  schemes:
  - station

dmg:
  sign: true
  contents:
  - x: 410
    y: 150
    type: link
    path: '/Applications'
  - x: 130
    y: 150
    type: file

mac:
  target:
#    - target: dmg
#      arch:
#        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-v${version}-${os}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  category: public.app-category.tools
  entitlements: 'build/entitlements.mac.plist'
  entitlementsInherit: 'build/entitlements.mac.plist'
  singleArchFiles: '*'
  
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  artifactName: ${productName}-v${version}-${os}-${arch}.${ext}
  verifyUpdateCodeSignature: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  category: Network
  artifactName: ${productName}-v${version}-${os}-${arch}.${ext}

extraResources:
  - from: '../../.env.production'
    to: '.env.production'
  - from: 'src/static/icon-app.png'
    to: 'icon-app.png'

files:
  - '!**/*.map'
  # electron-builder 26 walks the peer dependencies of production packages
  # (`electron-chrome-extension`, `@electron/remote`, ... all peer-depend on
  # `electron`), which drags the whole 300+MB dev Electron distribution into
  # the asar. The runtime `require('electron')` always resolves to the built-in
  # module, never to this one.
  - '!**/node_modules/electron/**'
  - from: 'src/static/icon--provider'
    to: 'static/icon--provider'
    filter:
      - 'icon-provider--gdrive.svg'
      - 'icon-provider--notion.svg'
      - 'icon-provider--slack.svg'
  - from: 'src/static/illustrations'
    to: 'static/illustrations'
  - from: 'src/static/logos'
    to: 'static/logos'
  - from: 'src/static/social-network'
    to: 'static/social-network'
  - from: 'src/static/animations'
    to: 'static/animations'

